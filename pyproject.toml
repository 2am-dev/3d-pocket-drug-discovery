[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket3d"
version = "0.1.0"
description = "3D pocket-based structure-driven drug discovery"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shaurya", email = "shaurya@nii.ac.in" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "biopython",
    "rdkit",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
